# Render Blueprint — one service serves static client + REST + MCP (brief §9 ship)
services:
  - type: web
    name: topovibe
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts && npm run build
    startCommand: npm start
    envVars:
      - key: QLOO_API_KEY
        sync: false # set manually in the Render dashboard — never commit it
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      # PORT is NOT set here: Render injects its own PORT and routes to it;
      # server/index.js reads process.env.PORT. Overriding can fail health checks.
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_CITIES
        value: Austin,New York City,Tokyo
    healthCheckPath: /api/health
